# Slaver Mail — self-hosted mail server (kirim + terima email sendiri).
# Image: docker-mailserver (Postfix + Dovecot + OpenDKIM + SpamAssassin, 1 container).
# Jalan di VPS (BUKAN Fly — butuh port 25 terbuka + reverse DNS/PTR).
# Cara pakai: copy .env.example -> .env, isi, lalu deploy ke VPS seperti biasa:
#   docker compose --env-file .env -f mail/docker-compose.yml up -d
# Lalu ikuti mail/README.md (DNS + akun + DKIM).

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: slaver-mail
    hostname: mail
    domainname: ${MAIL_DOMAIN:?set MAIL_DOMAIN, e.g. slaver.app}
    ports:
      - "25:25"     # SMTP masuk (wajib terbuka ke internet)
      - "587:587"   # SMTP kirim + auth ( Dipakai Slaver via MAIL_* )
      - "993:993"   # IMAP (baca email — untuk email app nanti)
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      - ./config:/tmp/docker-mailserver
    environment:
      - ENABLE_SPAMASSASSIN=1
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=1
      - SPOOF_PROTECTION=1
      - ENABLE_SRS=1
      - SSL_TYPE=self-signed
      - POSTMASTER_ADDRESS=postmaster@${MAIL_DOMAIN}
      - TZ=Asia/Jakarta
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

volumes:
  maildata:
  mailstate:
  maillogs:

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Slaver Mail — Email Usaha Sendiri</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #09090b; color: #f4f4f5; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #27272a; position: sticky; top: 0; background: #09090b; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; }
  header .spacer { flex: 1; }
  button { cursor: pointer; }
  .btn { background: #059669; border: 0; color: #fff; border-radius: 8px; padding: 10px 16px; font-weight: 700; font-size: 14px; }
  .btn:disabled { opacity: .5; }
  .btn-ghost { background: #27272a; color: #e4e4e7; border-radius: 8px; padding: 10px 16px; border: 0; font-size: 14px; }
  main { display: flex; min-height: calc(100vh - 57px); }
  aside { width: 220px; border-right: 1px solid #27272a; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  aside button.folder { text-align: left; background: none; border: 0; color: #d4d4d8; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  aside button.folder.on { background: #27272a; color: #fff; font-weight: 700; }
  section.list { flex: 1; min-width: 0; max-width: 420px; border-right: 1px solid #27272a; overflow-y: auto; }
  section.read { flex: 2; min-width: 0; padding: 16px; overflow-y: auto; }
  .msg { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid #18181b; padding: 12px 16px; color: #f4f4f5; display: block; }
  .msg.unseen { background: #0c1a14; }
  .msg.sel { background: #27272a; }
  .msg .s { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg .f { font-size: 12px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg .d { font-size: 11px; color: #71717a; }
  .empty { padding: 48px 24px; text-align: center; color: #71717a; font-size: 14px; }
  .readhead { border-bottom: 1px solid #27272a; padding-bottom: 12px; margin-bottom: 12px; }
  .readhead h2 { margin: 0 0 6px; font-size: 18px; }
  .readhead .meta { font-size: 12px; color: #a1a1aa; }
  .body { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.6; }
  .fab { position: fixed; right: 20px; bottom: 20px; background: #059669; color: #fff; border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 800; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal { background: #18181b; border: 1px solid #3f3f46; border-radius: 16px 16px 0 0; width: 100%; max-width: 560px; padding: 16px; max-height: 92vh; overflow-y: auto; }
  .modal input, .modal textarea { width: 100%; background: #27272a; border: 1px solid #3f3f46; color: #fff; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 4px; }
  .modal label { font-size: 12px; font-weight: 700; color: #a1a1aa; display: block; margin-top: 10px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .err { color: #f87171; font-size: 13px; margin-top: 8px; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 360px; background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 28px; }
  .login-card h1 { margin: 0 0 4px; font-size: 22px; }
  .login-card p { color: #a1a1aa; font-size: 13px; margin: 0 0 16px; }
  .hidden { display: none !important; }
  @media (max-width: 760px) {
    aside { display: none; }
    section.list.full { max-width: none; }
    section.read { display: none; }
    body.reading section.list { display: none; }
    body.reading section.read { display: block; }
    .backbtn { display: inline-block !important; }
  }
  .backbtn { display: none; }
  select.mobilefolders { display: none; width: 100%; margin: 8px 0 0; background: #27272a; color: #fff; border: 1px solid #3f3f46; border-radius: 8px; padding: 10px; }
  @media (max-width: 760px) { select.mobilefolders { display: block; } }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>Slaver Mail</h1>
  <span class="spacer"></span>
  <button id="logoutBtn" class="btn-ghost hidden" style="padding:6px 12px;font-size:12px">Keluar</button>
</header>

<div id="loginView" class="login-wrap hidden">
  <div class="login-card">
    <h1>Masuk</h1>
    <p id="loginHint">Masukkan kata sandi aplikasi (APP_PASSWORD).</p>
    <input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password" style="width:100%;background:#27272a;border:1px solid #3f3f46;color:#fff;border-radius:8px;padding:12px;font-size:15px" />
    <button id="loginBtn" class="btn" style="width:100%;margin-top:12px">Masuk</button>
    <button id="slaverBtn" class="btn-ghost hidden" style="width:100%;margin-top:8px">Masuk dengan Slaver</button>
    <p id="loginErr" class="err"></p>
  </div>
</div>

<main id="appView" class="hidden">
  <aside id="folderBar"></aside>
  <section class="list" id="listPane">
    <select class="mobilefolders" id="mobileFolders"></select>
    <div id="msgList"></div>
  </section>
  <section class="read" id="readPane">
    <div id="readEmpty" class="empty">Pilih email untuk dibaca.<br />Klik + untuk menulis email baru.</div>
    <div id="readContent" class="hidden">
      <button class="btn-ghost backbtn" id="backBtn" style="margin-bottom:12px">← Kembali</button>
      <div class="readhead">
        <h2 id="rSubject"></h2>
        <div class="meta" id="rMeta"></div>
      </div>
      <div class="body" id="rBody"></div>
      <div class="row">
        <button class="btn-ghost" id="replyBtn">Balas</button>
        <button class="btn-ghost" id="toggleSeenBtn">Tandai belum dibaca</button>
      </div>
    </div>
  </section>
</main>

<button id="composeFab" class="fab hidden">+ Tulis</button>

<div id="composeModal" class="modal-bg hidden">
  <div class="modal">
    <h3 style="margin:0">Email baru</h3>
    <label>Kepada <input id="cTo" type="email" placeholder="nama@email.com" /></label>
    <label>Subjek <input id="cSubject" placeholder="Subjek" /></label>
    <label>Isi <textarea id="cText" rows="8" placeholder="Tulis pesan…"></textarea></label>
    <p class="err" id="cErr"></p>
    <div class="row">
      <button class="btn" id="sendBtn" style="flex:1">Kirim</button>
      <button class="btn-ghost" id="cancelCompose">Batal</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let folder = "INBOX", openedUid = null, openedMsg = null;

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {}));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("Gagal (" + res.status + ")"));
  return data;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function boot() {
  let health = {};
  try { health = await api("/api/health"); } catch (e) { /* server belum siap */ }
  if (health.login_required) {
    $("loginView").classList.remove("hidden");
    try {
      const cfg = await api("/api/oauth/config");
      if (cfg.enabled) {
        const b = $("slaverBtn");
        b.classList.remove("hidden");
        b.onclick = () => {
          const state = Math.random().toString(36).slice(2);
          sessionStorage.setItem("slaver_oauth_state", state);
          const redirect = location.origin + "/oauth-callback.html";
          location.href = cfg.slaver_url + "/oauth/authorize?client_id=" + encodeURIComponent(cfg.client_id) +
            "&redirect_uri=" + encodeURIComponent(redirect) + "&scope=" + encodeURIComponent("openid profile email") +
            "&state=" + encodeURIComponent(state);
        };
      }
    } catch (e) {}
    return;
  }
  enter();
}

function enter() {
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("composeFab").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  loadFolders().then(loadList);
}

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try {
    await api("/api/login", { method: "POST", body: JSON.stringify({ password: $("pw").value }) });
    enter();
  } catch (e) { $("loginErr").textContent = e.message; }
};
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = async () => { try { await api("/api/logout", { method: "POST" }); } catch (e) {} location.reload(); };

async function loadFolders() {
  let folders = ["INBOX"];
  try { folders = (await api("/api/folders")).folders || folders; } catch (e) {}
  const bar = $("folderBar");
  bar.innerHTML = "";
  const sel = $("mobileFolders");
  sel.innerHTML = "";
  folders.forEach((f) => {
    const b = document.createElement("button");
    b.className = "folder" + (f === folder ? " on" : "");
    b.textContent = f === "INBOX" ? "📥 Masuk" : (f.toLowerCase().includes("sent") ? "📤 Terkirim" : "📁 " + f);
    b.onclick = () => { folder = f; openedUid = null; renderFolders(folders); loadList(); };
    bar.appendChild(b);
    const o = document.createElement("option");
    o.value = f; o.textContent = f;
    if (f === folder) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { folder = sel.value; openedUid = null; loadList(); };
  function renderFolders(list) {
    Array.from(bar.children).forEach((b, i) => b.classList.toggle("on", list[i] === folder));
  }
}

async function loadList() {
  const box = $("msgList");
  box.innerHTML = "<div class='empty'>Memuat…</div>";
  try {
    const data = await api("/api/messages?folder=" + encodeURIComponent(folder) + "&limit=50");
    const items = data.messages || [];
    if (!items.length) { box.innerHTML = "<div class='empty'>Kotak kosong. Email baru muncul di sini.</div>"; return; }
    box.innerHTML = "";
    items.forEach((m) => {
      const b = document.createElement("button");
      b.className = "msg" + (m.seen ? "" : " unseen") + (m.uid === openedUid ? " sel" : "");
      b.innerHTML = "<div class='s'>" + esc(m.subject) + "</div>" +
        "<div class='f'>" + esc(m.from) + "</div>" +
        "<div class='d'>" + esc(m.date) + (m.seen ? "" : " · baru") + "</div>";
      b.onclick = () => openMsg(m.uid);
      box.appendChild(b);
    });
  } catch (e) { box.innerHTML = "<div class='empty'>Gagal memuat: " + esc(e.message) + "</div>"; }
}

async function openMsg(uid) {
  openedUid = uid;
  try {
    const m = await api("/api/message?folder=" + encodeURIComponent(folder) + "&uid=" + encodeURIComponent(uid));
    openedMsg = m;
    document.body.classList.add("reading");
    $("readEmpty").classList.add("hidden");
    $("readContent").classList.remove("hidden");
    $("rSubject").textContent = m.subject;
    $("rMeta").textContent = "Dari: " + m.from + " · Untuk: " + m.to + " · " + m.date;
    $("rBody").textContent = m.body || "(kosong)";
    $("toggleSeenBtn").textContent = m.seen ? "Tandai belum dibaca" : "Tandai sudah dibaca";
    try { await api("/api/flag", { method: "POST", body: JSON.stringify({ folder: folder, uid: uid, seen: true }) }); } catch (e) {}
    loadList();
  } catch (e) { alert(e.message); }
}

$("backBtn").onclick = () => document.body.classList.remove("reading");
$("toggleSeenBtn").onclick = async () => {
  if (!openedMsg) return;
  try {
    await api("/api/flag", { method: "POST", body: JSON.stringify({ folder: folder, uid: openedUid, seen: !openedMsg.seen }) });
    openedMsg.seen = !openedMsg.seen;
    $("toggleSeenBtn").textContent = openedMsg.seen ? "Tandai belum dibaca" : "Tandai sudah dibaca";
    loadList();
  } catch (e) { alert(e.message); }
};
$("replyBtn").onclick = () => {
  if (!openedMsg) return;
  $("cTo").value = openedMsg.from;
  $("cSubject").value = openedMsg.subject.startsWith("Re:") ? openedMsg.subject : "Re: " + openedMsg.subject;
  $("cText").value = "\n\n--- balasan untuk ---\n" + (openedMsg.body || "").slice(0, 2000);
  $("cErr").textContent = "";
  $("composeModal").classList.remove("hidden");
};
$("composeFab").onclick = () => { $("cTo").value = ""; $("cSubject").value = ""; $("cText").value = ""; $("cErr").textContent = ""; $("composeModal").classList.remove("hidden"); };
$("cancelCompose").onclick = () => $("composeModal").classList.add("hidden");
$("composeModal").addEventListener("click", (e) => { if (e.target.id === "composeModal") $("composeModal").classList.add("hidden"); });

$("sendBtn").onclick = async () => {
  $("cErr").textContent = "";
  const to = $("cTo").value.trim(), subject = $("cSubject").value.trim(), text = $("cText").value;
  if (!to || !subject || !text.trim()) { $("cErr").textContent = "Tujuan, subjek, dan isi wajib diisi."; return; }
  $("sendBtn").disabled = true;
  $("sendBtn").textContent = "Mengirim…";
  try {
    await api("/api/send", { method: "POST", body: JSON.stringify({ to: to, subject: subject, text: text }) });
    $("composeModal").classList.add("hidden");
    if (folder.toLowerCase().includes("sent")) loadList();
  } catch (e) { $("cErr").textContent = e.message; }
  $("sendBtn").disabled = false;
  $("sendBtn").textContent = "Kirim";
};

boot();
</script>
</body>
</html>

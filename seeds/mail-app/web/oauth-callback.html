<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Masuk dengan Slaver…</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #09090b; color: #f4f4f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  p { color: #a1a1aa; }
  .err { color: #f87171; }
</style>
</head>
<body>
<p id="msg">Memverifikasi login Slaver…</p>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), state = q.get("state"), err = q.get("error");
  const msg = document.getElementById("msg");
  try {
    if (err) throw new Error("Login dibatalkan: " + err);
    if (!code) throw new Error("Tidak ada kode login.");
    if (state !== sessionStorage.getItem("slaver_oauth_state")) throw new Error("State tidak cocok (coba lagi).");
    const res = await fetch("/api/oauth/exchange", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code, redirect_uri: location.origin + "/oauth-callback.html" }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Gagal login.");
    location.href = "/";
  } catch (e) {
    msg.textContent = e.message;
    msg.className = "err";
  }
})();
</script>
</body>
</html>

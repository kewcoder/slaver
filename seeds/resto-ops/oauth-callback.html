<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Masuk dengan Slaver…</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #faf7f2; color: #1c1917; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  p { color: #57534e; } .err { color: #b91c1c; }
</style>
</head>
<body>
<p id="msg">Memverifikasi login Slaver…</p>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get("code"), state = q.get("state"), err = q.get("error");
  var msg = document.getElementById("msg");
  function fail(t) { msg.textContent = t; msg.className = "err"; }
  if (err) return fail("Login dibatalkan: " + err);
  if (!code) return fail("Tidak ada kode login.");
  if (state !== sessionStorage.getItem("slaver_oauth_state")) return fail("State tidak cocok (coba lagi).");
  fetch("/api/oauth/exchange", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code, redirect_uri: location.origin + "/oauth-callback.html" }) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (x) {
      if (!x.ok) throw new Error((x.d && x.d.error) || "Login gagal");
      try { localStorage.setItem("ro_staff", JSON.stringify(x.d.user || {})); } catch (e) {}
      location.href = "/";
    })
    .catch(function (e) { fail(e.message); });
})();
</script>
</body>
</html>

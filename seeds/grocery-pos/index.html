<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grocery POS Lite</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f6f4; color: #1a1a1a; }
  header { background: #166534; color: #fff; padding: 12px 16px; font-weight: 700; }
  main { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; padding: 12px; max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px; text-align: left; cursor: pointer; }
  .card:hover { border-color: #166534; }
  .card b { display: block; }
  .cart { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px; align-self: start; position: sticky; top: 12px; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
  .total { font-weight: 800; font-size: 18px; margin: 8px 0; }
  button.pay { width: 100%; background: #166534; color: #fff; border: 0; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
  @media print { main { display: block; } .no-print { display: none; } }
</style>
</head>
<body>
<header>🛒 Grocery POS Lite <small id="clock"></small></header>
<main>
  <section>
    <input id="q" class="no-print" placeholder="Cari produk…" style="width:100%;padding:10px;margin-bottom:8px;border:1px solid #ddd;border-radius:8px" />
    <div class="grid" id="products"></div>
  </section>
  <aside class="cart">
    <h3>Keranjang</h3>
    <div id="cart"></div>
    <div class="total" id="total">Rp 0</div>
    <button class="pay" onclick="checkout()">Bayar / Cetak</button>
    <button class="pay no-print" style="background:#666;margin-top:6px" onclick="clearCart()">Bersihkan</button>
  </aside>
</main>
<script>
const fmt = (n) => "Rp " + n.toLocaleString("id-ID");
let products = JSON.parse(localStorage.getItem("pos_products") || "null") || [
  { id: "BR001", name: "Beras 5kg", price: 68500 },
  { id: "ML002", name: "Minyak 2L", price: 42500 },
  { id: "TL003", name: "Telur 1kg", price: 28000 },
  { id: "GL004", name: "Gula 1kg", price: 17500 },
  { id: "KM005", name: "Kopi 200g", price: 24000 },
  { id: "MH006", name: "Mie Instan", price: 3500 },
];
let cart = {};
function render() {
  const q = (document.getElementById("q").value || "").toLowerCase();
  document.getElementById("products").innerHTML = products
    .filter((p) => p.name.toLowerCase().includes(q))
    .map((p, i) => `<button class="card" onclick="add(${products.indexOf(p)})"><b>${p.name}</b><span>${fmt(p.price)}</span></button>`)
    .join("");
  const keys = Object.keys(cart);
  document.getElementById("cart").innerHTML = keys.length
    ? keys.map((k) => `<div class="row"><span>${cart[k].n} × ${cart[k].q}</span><span>${fmt(cart[k].n * 0 + cart[k].p * cart[k].q)} <a href="#" onclick="dec('${k}');return false">−</a></span></div>`).join("")
    : "<i>Keranjang kosong</i>";
  const total = keys.reduce((s, k) => s + cart[k].p * cart[k].q, 0);
  document.getElementById("total").textContent = fmt(total);
}
function add(i) { const p = products[i]; const k = p.id; cart[k] = cart[k] || { n: p.name, p: p.price, q: 0 }; cart[k].q++; render(); }
function dec(k) { cart[k].q--; if (cart[k].q <= 0) delete cart[k]; render(); }
function clearCart() { cart = {}; render(); }
function checkout() {
  const slip = Object.entries(cart).map(([k, v]) => `${v.n} x${v.q} = ${fmt(v.p * v.q)}`).join("\n") +
    "\nTOTAL: " + document.getElementById("total").textContent;
  const day = new Date().toISOString().slice(0, 10);
  const log = JSON.parse(localStorage.getItem("pos_sales_" + day) || "[]");
  log.push({ at: new Date().toISOString(), total: document.getElementById("total").textContent, items: cart });
  localStorage.setItem("pos_sales_" + day, JSON.stringify(log));
  alert("Tersimpan.\n\n" + slip);
  window.print();
}
document.getElementById("q").addEventListener("input", render);
setInterval(() => { document.getElementById("clock").textContent = new Date().toLocaleString("id-ID"); }, 1000);
render();
</script>
</body>
</html>

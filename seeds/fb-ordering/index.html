<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F&B Ordering Lite</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fff7ed; color: #1a1a1a; }
  header { background: #c2410c; color: #fff; padding: 12px 16px; font-weight: 700; display: flex; gap: 8px; }
  header button { background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  header button.on { background: #fff; color: #c2410c; font-weight: 700; }
  main { max-width: 900px; margin: 0 auto; padding: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 10px; text-align: left; cursor: pointer; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #eee; }
  .ticket { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .big { width: 100%; background: #c2410c; color: #fff; border: 0; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>
<header>
  🍜 F&B Ordering Lite
  <span style="flex:1"></span>
  <button id="tabMenu" class="on" onclick="tab('menu')">Menu</button>
  <button id="tabKitchen" onclick="tab('kitchen')">Dapur (<span id="kcount">0</span>)</button>
</header>
<main>
  <section id="vmenu">
    <input id="meja" placeholder="Nomor meja" style="width:120px;padding:10px;border:1px solid #ddd;border-radius:8px" />
    <div class="grid" id="menu" style="margin-top:8px"></div>
    <h3>Pesanan</h3>
    <div id="cart"></div>
    <button class="big" onclick="order()">Kirim ke Dapur</button>
  </section>
  <section id="vkitchen" style="display:none">
    <h3>Antrian Dapur</h3>
    <div id="tickets"></div>
  </section>
</main>
<script>
const fmt = (n) => "Rp " + n.toLocaleString("id-ID");
const MENU = [
  { id: "N01", name: "Nasi Goreng", price: 15000 },
  { id: "M02", name: "Mie Goreng", price: 13000 },
  { id: "A03", name: "Ayam Geprek", price: 12000 },
  { id: "E04", name: "Es Teh", price: 5000 },
  { id: "J05", name: "Jus Alpukat", price: 12000 },
];
let cart = {};
let view = "menu";
function tab(v) {
  view = v;
  document.getElementById("vmenu").style.display = v === "menu" ? "" : "none";
  document.getElementById("vkitchen").style.display = v === "kitchen" ? "" : "none";
  document.getElementById("tabMenu").className = v === "menu" ? "on" : "";
  document.getElementById("tabKitchen").className = v === "kitchen" ? "on" : "";
  render();
}
function orders() { try { return JSON.parse(localStorage.getItem("fb_orders") || "[]"); } catch { return []; } }
function saveOrders(o) { localStorage.setItem("fb_orders", JSON.stringify(o)); }
function render() {
  document.getElementById("menu").innerHTML = MENU.map((m, i) => `<button class="card" onclick="add(${i})"><b>${m.name}</b><br>${fmt(m.price)}</button>`).join("");
  const keys = Object.keys(cart);
  document.getElementById("cart").innerHTML = keys.length
    ? keys.map((k) => { const it = MENU.find((m) => m.id === k); return `<div class="row"><span>${it.name} × ${cart[k]}</span><span>${fmt(it.price * cart[k])}</span></div>`; }).join("")
    : "<i>Belum ada pesanan</i>";
  const os = orders();
  document.getElementById("kcount").textContent = os.filter((o) => o.status === "baru").length;
  document.getElementById("tickets").innerHTML = os.length
    ? os.map((o, i) => `<div class="ticket"><b>Meja ${o.meja}</b> <small>${o.at}</small> — <b>${o.status}</b><br>${o.items.map((x) => `${x.n} ×${x.q}`).join(", ")}<br>${o.status === "baru" ? `<button onclick="done(${i})">Selesai</button>` : ""}</div>`).reverse().join("")
    : "<i>Antrian kosong</i>";
}
function add(i) { const k = MENU[i].id; cart[k] = (cart[k] || 0) + 1; render(); }
function order() {
  const keys = Object.keys(cart);
  if (!keys.length) return alert("Keranjang kosong");
  const meja = document.getElementById("meja").value || "-";
  const os = orders();
  os.push({ meja, at: new Date().toLocaleString("id-ID"), status: "baru", items: keys.map((k) => { const m = MENU.find((x) => x.id === k); return { n: m.name, q: cart[k] }; }) });
  saveOrders(os);
  cart = {};
  render();
  alert("Pesanan dikirim ke dapur (meja " + meja + ")");
}
function done(i) { const os = orders(); os[i].status = "selesai"; saveOrders(os); render(); }
render();
</script>
</body>
</html>

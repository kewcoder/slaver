<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slaver Desktop</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4ef; color: #1d2330; font: 15px/1.5 system-ui, sans-serif; }
      .box { text-align: center; }
      .spin { width: 28px; height: 28px; margin: 0 auto 12px; border-radius: 50%; border: 3px solid #d6cfc2; border-top-color: #b45309; animation: s 0.8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      .muted { color: #6b7280; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spin"></div>
      <div><strong>Slaver Desktop</strong></div>
      <div class="muted" id="msg">Menyiapkan platform lokal…</div>
    </div>
    <script type="module">
      // The embedded Slaver platform boots in the background; jump in once ready.
      const { invoke } = window.__TAURI__.core;
      for (let i = 0; i < 600; i++) {
        try {
          const base = await invoke("platform_url");
          if (base) {
            const r = await fetch(base + "/ping", { cache: "no-store" });
            if (r.ok) { location.replace(base + "/"); break; }
          }
        } catch { /* not ready yet */ }
        if (i === 40) document.getElementById("msg").textContent = "Masih menyiapkan… (pertama kali agak lama)";
        await new Promise((r) => setTimeout(r, 500));
      }
    </script>
  </body>
</html>

# Template for ONE client deployment. Copy per client, then:
#   fly launch --no-deploy --copy-config   (set app name and region)
#   fly volumes create fnb_data --size 1 -r <region>
#   fly secrets set ADMIN_TOKEN=$(openssl rand -hex 32)
#   fly deploy
# Single machine only: SQLite is single-writer, so do not scale this app horizontally.
app = "fnb-CLIENT-NAME"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/fnb.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "fnb_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    port = 8080
    type = "http"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
